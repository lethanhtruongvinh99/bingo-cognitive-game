      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap"

    />

      /* Use Inter as the default font */
      body {
        font-family: "Inter", sans-serif;
        overflow: hidden; /* Hide scrollbars */
      }
      /* Custom styles for the timer bar */
      #timer-bar-inner {
        transition: width 0.1s linear;
      }
      /* Simple pulse animation for the message */
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      #message-box {
        animation: pulse 1.5s infinite;
      }
    </style>

            Dễ

      // --- Utility Function ---
      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      /**
       * Starts the game when the start button is clicked
       */
      function startGame() {
        startScreen.classList.add("hidden");
        gameArea.classList.remove("hidden");
        score = 0;
        round = 0;
        scoreEl.textContent = score;
        roundEl.textContent = round;
        nextRound();
      }

      /**
       * Sets up and starts the next round
       */
      function nextRound() {
        // Check if game is over
        if (round >= MAX_ROUNDS) {
          endGame();
          return;
        }

        // 1. Reset round state
        gameInProgress = true;
        round++;
        roundEl.textContent = round;
        messageOverlay.classList.add("hidden"); // Hide any previous messages
        bingoButton.disabled = false;

        // Get 3 unique random images for this round
        shuffleArray(IMAGE_REPO);
        currentImages = IMAGE_REPO.slice(0, numImagesToShow);

        // Get all keywords present in these 3 images
        const presentKeywords = new Set();
        currentImages.forEach((img) => {
          img.keywords.forEach((kw) => presentKeywords.add(kw));
        });

        // Get all possible keywords from the entire repo
        const allKeywords = new Set();
        IMAGE_REPO.forEach((img) => {
          img.keywords.forEach((kw) => allKeywords.add(kw));
        });

        // Get keywords that are *not* present in the 3 images
        const absentKeywords = new Set(
          [...allKeywords].filter((kw) => !presentKeywords.has(kw))
        );

        // --- Decide round type and number of keywords ---
        let shouldKeywordBePresent = Math.random() < 0.7; // 70% chance a 'present' keyword will be shown
        // Use the new gameDifficulty variable instead of a random number
        const numKeywords = gameDifficulty;

        const presentArr = [...presentKeywords];
        const absentArr = [...absentKeywords];

        // Handle edge cases where no present/absent keywords exist
        if (presentArr.length === 0) shouldKeywordBePresent = false;
        if (absentArr.length === 0) shouldKeywordBePresent = true;
        if (presentArr.length === 0 && absentArr.length === 0) {
          console.error("No keywords found in repository!");
          return; // Can't play
        }

        currentKeywords = []; // Reset keywords
        shuffleArray(presentArr);
        shuffleArray(absentArr);

        if (shouldKeywordBePresent) {
          // This round is a "click" round.
          // Add 1 present keyword
          currentKeywords.push(presentArr[0]);
          // Fill the rest with absent keywords
          currentKeywords.push(...absentArr.slice(0, numKeywords - 1));
        } else {
          // This round is a "don't click" round.
          // Add 1-3 absent keywords
          currentKeywords = absentArr.slice(0, numKeywords);
        }

        // Shuffle the final list of keywords to show
        shuffleArray(currentKeywords);

        // 3. Render the keywords as pills

          .map(
            (kw) =>
              `<span class="inline-block bg-gray-700 text-cyan-400 px-4 py-2 rounded-lg text-2xl sm:text-3xl">${kw}</span>`
          )
          .join("");

        imageContainer.innerHTML = ""; // Clear previous images

        let gridColsClass = "grid-cols-3";
        if (numImagesToShow === 1) gridColsClass = "grid-cols-1";
        else if (numImagesToShow === 2) gridColsClass = "grid-cols-2";
        else if (numImagesToShow === 4)
          gridColsClass = "grid-cols-2 sm:grid-cols-4"; // Better responsive
        else if (numImagesToShow === 5 || numImagesToShow === 6)
          gridColsClass = "grid-cols-3";
        currentImages.forEach((img) => {
          const imgElement = document.createElement("img");
          imgElement.src = img.url;
          imgElement.alt = img.keywords.join(", "); // Use keywords for alt text
          // Added responsive height and object-fit
          imgElement.className =
            "w-full h-24 sm:h-40 md:h-48 object-cover rounded-lg shadow-lg border-2 border-gray-700";
          imageContainer.appendChild(imgElement);
        });

        // 4. Start the timers
        startTimers();
      }

      /**
       * Starts the 3-second round timer and the visual timer bar
       */
      function startTimers() {
        // Clear any old timers
        clearTimeout(roundTimerId);
        cancelAnimationFrame(visualTimerId);

        const startTime = Date.now();

        // This is the main game timer, using the new variable
        roundTimerId = setTimeout(timerExpires, roundTimeMs);

        // This function updates the visual bar
        function updateVisualTimer(timestamp) {
          if (!gameInProgress) return; // Stop if game state changed

          const elapsed = Date.now() - startTime;
          const remainingPercent = Math.max(
            0,
            100 - (elapsed / roundTimeMs) * 100
          );
          timerBarInner.style.width = `${remainingPercent}%`;

          if (elapsed < roundTimeMs) {
            visualTimerId = requestAnimationFrame(updateVisualTimer);
          } else {
            timerBarInner.style.width = "0%";
          }
        }

        // Start the visual timer loop
        visualTimerId = requestAnimationFrame(updateVisualTimer);
      }

      /**
       * Called when the player clicks the BINGO button
       */
      function handleBingoClick() {
        if (!gameInProgress) return; // Prevent multiple clicks

        // 1. Stop timers and game logic
        gameInProgress = false;
        clearTimeout(roundTimerId);
        cancelAnimationFrame(visualTimerId);
        bingoButton.disabled = true;

        // 2. Check for win/loss
        // Updated check for array of keywords
        const presentKeywordsInImages = new Set();
        currentImages.forEach((img) => {
          img.keywords.forEach((kw) => presentKeywordsInImages.add(kw));
        });
        // Check if *any* of the shown keywords are in the images
        const isAnyKeywordPresent = currentKeywords.some((kw) =>
          presentKeywordsInImages.has(kw)
        );

        if (isAnyKeywordPresent) {
          // WIN! Correctly clicked.
          score++;
          scoreEl.textContent = score;
          showResult(true, "BINGO! Tuyệt vời");
        } else {
          // LOSE! Clicked when keyword wasn't there.
          showResult(false, "Oops! Sai rồi");
        }
      }

      /**
       * Called when the 3-second timer runs out
       */
      function timerExpires() {
        if (!gameInProgress) return; // Already handled by a click

        // 1. Stop game logic
        gameInProgress = false;
        cancelAnimationFrame(visualTimerId);
        bingoButton.disabled = true;
        timerBarInner.style.width = "0%"; // Ensure bar is empty

        // 2. Check for win/loss
        // Updated check for array of keywords
        const presentKeywordsInImages = new Set();
        currentImages.forEach((img) => {
          img.keywords.forEach((kw) => presentKeywordsInImages.add(kw));
        });
        // Check if *any* of the shown keywords were in the images
        const isAnyKeywordPresent = currentKeywords.some((kw) =>
          presentKeywordsInImages.has(kw)
        );

        if (isAnyKeywordPresent) {
          // LOSE! Ran out of time when they should have clicked.
          showResult(false, "Oops! Bạn chậm quá");
        } else {
          // WIN! Correctly did *not* click.
          score++;
          scoreEl.textContent = score;
          showResult(true, "Bạn thật tinh mắt, không có ở đây");
        }
      }

      /**
       * Displays the win/loss message and schedules the next round
       */
      function showResult(isWin, message) {
        messageText.textContent = message;

        // Apply win/loss colors
        messageBox.classList.remove(
          "text-green-400",
          "text-red-400",
          "bg-gray-800"
        );
        if (isWin) {
          messageBox.classList.add("text-green-400", "bg-gray-800");
        } else {
          messageBox.classList.add("text-red-400", "bg-gray-800");
        }

        // Show the message
        messageOverlay.classList.remove("hidden");

        // Go to the next round after a short delay
        setTimeout(nextRound, 1500);
      }

      /**
       * Ends the game and shows the final score
       */
      function endGame() {
        gameInProgress = false;
        clearTimeout(roundTimerId);
        cancelAnimationFrame(visualTimerId);
        bingoButton.disabled = true;

        // Show final score message
        messageText.textContent = `Kết thúc rồi. Bạn được: ${score}/${MAX_ROUNDS}`;
        messageBox.classList.remove(
          "text-green-400",
          "text-red-400",
          "bg-gray-800"
        );
        messageBox.classList.add("text-cyan-400", "bg-gray-800"); // Use a neutral color
        messageOverlay.classList.remove("hidden");

        // After a delay, reset to start screen
        setTimeout(returnToStart, 3000); // Use the new function
      }

      /**
       * Resets the game to the start screen.
       * Can be called by the stop button or after the game ends.
       */
      function returnToStart() {
        gameInProgress = false;
        clearTimeout(roundTimerId);
        cancelAnimationFrame(visualTimerId);

        messageOverlay.classList.add("hidden");
        gameArea.classList.add("hidden");
        startScreen.classList.remove("hidden");
        // No need to set button text anymore
      }

      /**
       * Sets the difficulty and starts the game
       */
      function setDifficultyAndStart(difficulty, timeInSeconds) {
        gameDifficulty = difficulty;
        roundTimeMs = timeInSeconds * 1000;
        numImagesToShow = 3; // Reset to default for standard modes

        startGame();
      }

      // --- Event Listeners ---
      // New listeners for difficulty buttons
      startEasyButton.addEventListener("click", () =>
        setDifficultyAndStart(1, 3)
      );
      startMediumButton.addEventListener("click", () =>
        setDifficultyAndStart(2, 4)
      );
      startHardButton.addEventListener("click", () =>
        setDifficultyAndStart(3, 5)
      );
      startExtremeButton.addEventListener("click", () =>
        setDifficultyAndStart(3, 3)
      ); // New

      startCustomButton.addEventListener("click", () => {
        startScreen.classList.add("hidden");
        customScreen.classList.remove("hidden");
        customError.classList.add("hidden"); // Hide error on open
      });

      backButton.addEventListener("click", () => {
        customScreen.classList.add("hidden");
        startScreen.classList.remove("hidden");
        customError.classList.add("hidden"); // Hide error on back
      });
      startCustomGameButton.addEventListener("click", () => {
        // Read values, clamp them to min/max
        const keywords = parseInt(customKeywordsInput.value);
        const time = parseInt(customTimeInput.value);
        const images = parseInt(customImagesInput.value);

        // --- New Validation ---
        if (isNaN(keywords) || isNaN(time) || isNaN(images)) {
          customError.textContent =
            "Vui lòng điền đầy đủ các tùy chỉnh.";
          customError.classList.remove("hidden");
          return; // Stop here
        }
        // --- End Validation ---

        customError.classList.add("hidden"); // Hide error if validation passed

        // Apply clamped values
        gameDifficulty = Math.max(1, Math.min(5, keywords));
        roundTimeMs = Math.max(1, Math.min(10, time)) * 1000;
        numImagesToShow = Math.max(1, Math.min(6, images));

        // Update inputs to show clamped values
        customKeywordsInput.value = gameDifficulty;
        customTimeInput.value = roundTimeMs / 1000;
        customImagesInput.value = numImagesToShow;

        customScreen.classList.add("hidden");
        startGame();
      });

      bingoButton.addEventListener("click", handleBingoClick);
      stopButton.addEventListener("click", returnToStart); // Add listener for the new button
    </script>
  </body>
</html>
